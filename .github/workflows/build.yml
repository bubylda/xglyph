name: Build XGlyph

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package macOS app
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build universal app and run tests
        run: make ARCHS="arm64 x86_64" test

      - name: Verify and package
        run: |
          lipo -archs build/XGlyph.app/Contents/MacOS/XGlyph | python3 -c 'import sys; assert {"arm64", "x86_64"} <= set(sys.stdin.read().split())'
          codesign --verify --strict build/XGlyph.app
          mkdir -p build/dist
          ditto -c -k --keepParent build/XGlyph.app build/dist/XGlyph-universal.zip
          cd build/dist
          shasum -a 256 XGlyph-universal.zip > XGlyph-universal.zip.sha256

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: XGlyph-universal
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14
